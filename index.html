<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>액티브 랙돌</title>
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <div id="hud" class="overlay-col">
          <div id="status" class="overlay"></div>
          <div id="chars"></div>
        </div>
        <div id="assistWarn" class="overlay"></div>
        <div id="pushInfo" class="overlay"></div>
        <div id="legend" class="overlay"></div>
        <div id="graphBox"><canvas id="graph"></canvas></div>
        <div id="coach"></div>
        <div id="dock"></div>
        <div id="loading"><span class="spinner" aria-hidden="true"></span><span id="loadingText">불러오는 중…</span></div>
      </div>
      <aside id="panel">
        <header id="panelHead">
          <h1 id="appTitle">액티브 랙돌</h1>
          <p class="sub">근육과 균형으로 버티는 물리 캐릭터예요. 밀고, 쏘고, 터뜨려 보세요.</p>
          <div id="modeRow"></div>
        </header>
      </aside>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
